
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kana Speedrun</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green-dark: #1a3d2b;
    --green-mid: #2d6a45;
    --green-light: #3d8a5a;
    --green-accent: #4caf70;
    --green-glow: #6fcf97;
    --cream: #f7f3ea;
    --cream-dark: #ede8dc;
    --cream-darker: #d9d2c3;
    --text-dark: #1a2e1f;
    --text-mid: #3d5c42;
    --white: #fdfaf4;
  }

  body {
    font-family: 'DM Mono', monospace;
    background-color: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  /* <-- Header --> */
  .site-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .site-header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 3rem;
    color: var(--green-dark);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .site-header h1 span {
    font-style: italic;
    color: var(--green-mid);
  }

  .site-header p {
    font-size: 0.75rem;
    color: var(--text-mid);
    margin-top: 0.4rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* <-- Main card --> */
  .card {
    background: var(--white);
    border: 1.5px solid var(--cream-darker);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 680px;
    position: relative;
  }

  /* <-- Screens --> */
  .screen { display: none; }
  .screen.active { display: block; }

  /* <-- Mode selection --> */
  .mode-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-mid);
    margin-bottom: 1.2rem;
    text-align: center;
  }

  .mode-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .mode-btn {
    background: var(--cream);
    border: 1.5px solid var(--cream-darker);
    border-radius: 10px;
    padding: 1.2rem 0.5rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s ease;
    font-family: 'DM Mono', monospace;
  }

  .mode-btn:hover {
    border-color: var(--green-mid);
    background: var(--cream-dark);
  }

  .mode-btn.selected {
    border-color: var(--green-dark);
    background: var(--green-dark);
    color: var(--cream);
  }

  .mode-btn .kana-sample {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1.5rem;
    display: block;
    margin-bottom: 0.3rem;
  }

  .mode-btn .kana-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .records-preview {
    border-top: 1px solid var(--cream-darker);
    padding-top: 1.2rem;
    margin-bottom: 1.5rem;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.5rem;
  }

  .record-item {
    text-align: center;
  }

  .record-item .r-label {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-mid);
    display: block;
    margin-bottom: 0.2rem;
  }

  .record-item .r-time {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--green-dark);
  }

  .start-btn {
    width: 100%;
    background: var(--green-dark);
    color: var(--cream);
    border: none;
    border-radius: 10px;
    padding: 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.18s ease;
  }

  .start-btn:hover { background: var(--green-mid); }
  .start-btn:disabled { background: var(--cream-darker); color: var(--text-mid); cursor: not-allowed; }

  /* <-- Countdown --> */
  .countdown-screen {
    text-align: center;
    padding: 3rem 0;
  }

  .countdown-number {
    font-family: 'Instrument Serif', serif;
    font-size: 8rem;
    color: var(--green-dark);
    line-height: 1;
    animation: countPop 0.8s ease forwards;
  }

  @keyframes countPop {
    0% { transform: scale(1.4); opacity: 0; }
    40% { transform: scale(0.95); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .countdown-sub {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-mid);
    margin-top: 0.5rem;
  }

  /* <-- Game screen --> */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--cream-darker);
  }

  .timer-display {
    font-size: 1.6rem;
    font-weight: 500;
    color: var(--green-dark);
    letter-spacing: 0.05em;
  }

  .progress-info {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-mid);
    text-align: right;
  }

  .progress-bar-wrap {
    height: 3px;
    background: var(--cream-dark);
    border-radius: 99px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--green-dark);
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* <-- Kana display --> */
  .kana-sequence {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.5rem;
    min-height: 80px;
    align-items: flex-start;
    align-content: flex-start;
  }

  .kana-token {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 1.8rem;
    padding: 0.2rem 0.4rem;
    border-radius: 6px;
    transition: color 0.2s ease, background 0.2s ease;
    color: var(--text-dark);
    background: transparent;
  }

  .kana-token.done {
    color: var(--green-accent);
  }

  .kana-token.current {
    color: var(--green-dark);
    background: var(--cream-dark);
    border-bottom: 2px solid var(--green-dark);
  }

  .kana-token.pending {
    color: var(--cream-darker);
  }

  /* <-- Input area --> */
  .input-area {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .romaji-input {
    flex: 1;
    background: var(--cream);
    border: 1.5px solid var(--cream-darker);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.15s ease;
    letter-spacing: 0.05em;
  }

  .romaji-input:focus { border-color: var(--green-mid); }
  .romaji-input.wrong { border-color: #c0392b; background: #fdf0ee; animation: shake 0.25s ease; }
  .romaji-input.correct { border-color: var(--green-accent); background: #f0faf4; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .input-hint {
    font-size: 0.65rem;
    color: var(--text-mid);
    letter-spacing: 0.05em;
    width: 60px;
    text-align: center;
    line-height: 1.4;
  }

  /* <-- Results screen --> */
  .results-screen { text-align: center; }

  .result-time {
    font-family: 'Instrument Serif', serif;
    font-size: 5rem;
    color: var(--green-dark);
    line-height: 1;
    margin: 1rem 0;
  }

  .result-time .unit {
    font-size: 1.5rem;
    color: var(--text-mid);
  }

  .result-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-mid);
  }

  .record-badge {
    display: inline-block;
    background: var(--green-dark);
    color: var(--cream);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 99px;
    margin-top: 0.5rem;
  }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin: 1.5rem 0;
  }

  .stat-box {
    background: var(--cream);
    border: 1px solid var(--cream-darker);
    border-radius: 10px;
    padding: 0.9rem;
  }

  .stat-box .s-val {
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--green-dark);
    display: block;
  }

  .stat-box .s-label {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-mid);
    display: block;
    margin-top: 0.15rem;
  }

  .result-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }

  .action-btn {
    padding: 0.85rem;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .action-btn.primary {
    background: var(--green-dark);
    color: var(--cream);
    border: 1.5px solid var(--green-dark);
  }

  .action-btn.primary:hover { background: var(--green-mid); border-color: var(--green-mid); }

  .action-btn.secondary {
    background: transparent;
    color: var(--text-dark);
    border: 1.5px solid var(--cream-darker);
  }

  .action-btn.secondary:hover { border-color: var(--green-mid); }

  .best-record-line {
    font-size: 0.7rem;
    color: var(--text-mid);
    margin-top: 0.4rem;
  }
</style>
</head>
<body>

<header class="site-header">
  <h1>kana <span>speedrun</span></h1>
  <p>hiragana · katakana · precision · vitesse</p>
</header>

<main class="card">

  <!-- <-- Mode selection screen --> -->
  <div class="screen active" id="screen-menu">
    <p class="mode-label">Choisir un mode</p>
    <div class="mode-buttons">
      <button class="mode-btn" id="btn-hiragana" onclick="selectMode('hiragana')">
        <span class="kana-sample">あ</span>
        <span class="kana-label">Hiragana</span>
      </button>
      <button class="mode-btn" id="btn-katakana" onclick="selectMode('katakana')">
        <span class="kana-sample">ア</span>
        <span class="kana-label">Katakana</span>
      </button>
      <button class="mode-btn" id="btn-both" onclick="selectMode('both')">
        <span class="kana-sample">あア</span>
        <span class="kana-label">Les deux</span>
      </button>
    </div>

    <div class="records-preview">
      <div class="record-item">
        <span class="r-label">Hiragana</span>
        <span class="r-time" id="rec-hiragana">--:--.--</span>
      </div>
      <div class="record-item">
        <span class="r-label">Katakana</span>
        <span class="r-time" id="rec-katakana">--:--.--</span>
      </div>
      <div class="record-item">
        <span class="r-label">Les deux</span>
        <span class="r-time" id="rec-both">--:--.--</span>
      </div>
    </div>

    <button class="start-btn" id="start-btn" onclick="startCountdown()" disabled>
      Selectionner un mode
    </button>
  </div>

  <!-- <-- Countdown screen --> -->
  <div class="screen" id="screen-countdown">
    <div class="countdown-screen">
      <div class="countdown-number" id="countdown-num">3</div>
      <div class="countdown-sub" id="countdown-sub">preparez-vous</div>
    </div>
  </div>

  <!-- <-- Game screen --> -->
  <div class="screen" id="screen-game">
    <div class="game-header">
      <div class="timer-display" id="timer-display">00:00.00</div>
      <div class="progress-info">
        <div id="progress-text">0 / 20</div>
        <div id="mode-label-game" style="margin-top:2px;"></div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
    </div>

    <div class="kana-sequence" id="kana-sequence"></div>

    <div class="input-area">
      <input
        type="text"
        class="romaji-input"
        id="romaji-input"
        placeholder="romaji..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
      <div class="input-hint" id="input-hint"></div>
    </div>
  </div>

  <!-- <-- Results screen --> -->
  <div class="screen" id="screen-results">
    <div class="results-screen">
      <p class="result-label">temps final</p>
      <div class="result-time" id="result-time-display">
        00:00<span class="unit">.00</span>
      </div>
      <div id="new-record-badge"></div>
      <p class="best-record-line" id="best-record-line"></p>

      <div class="result-stats">
        <div class="stat-box">
          <span class="s-val" id="stat-kana">20</span>
          <span class="s-label">kana ecrits</span>
        </div>
        <div class="stat-box">
          <span class="s-val" id="stat-speed">0</span>
          <span class="s-label">kana / seconde</span>
        </div>
      </div>

      <div class="result-actions">
        <button class="action-btn primary" onclick="retryGame()">Rejouer</button>
        <button class="action-btn secondary" onclick="goToMenu()">Changer de mode</button>
      </div>
    </div>
  </div>

</main>

<script>
// <-- Kana data with all variants and combos -->
const HIRAGANA = [
  { kana: 'あ', romaji: ['a'] }, { kana: 'い', romaji: ['i'] }, { kana: 'う', romaji: ['u'] },
  { kana: 'え', romaji: ['e'] }, { kana: 'お', romaji: ['o'] },

  { kana: 'ま', romaji: ['ma'] }, { kana: 'み', romaji: ['mi'] }, { kana: 'む', romaji: ['mu'] },
  { kana: 'め', romaji: ['me'] }, { kana: 'も', romaji: ['mo'] },
  { kana: 'や', romaji: ['ya'] }, { kana: 'ゆ', romaji: ['yu'] }, { kana: 'よ', romaji: ['yo'] },
  { kana: 'ら', romaji: ['ra'] }, { kana: 'り', romaji: ['ri'] }, { kana: 'る', romaji: ['ru'] },
  { kana: 'れ', romaji: ['re'] }, { kana: 'ろ', romaji: ['ro'] },
  { kana: 'わ', romaji: ['wa'] }, { kana: 'を', romaji: ['wo','o'] }, { kana: 'ん', romaji: ['n','nn'] },

  { kana: 'が', romaji: ['ga'] }, { kana: 'ぎ', romaji: ['gi'] }, { kana: 'ぐ', romaji: ['gu'] },

  { kana: 'ぺ', romaji: ['pe'] }, { kana: 'ぽ', romaji: ['po'] },
  // Combos
  { kana: 'きゃ', romaji: ['kya'] }, { kana: 'きゅ', romaji: ['kyu'] }, { kana: 'きょ', romaji: ['kyo'] },
  { kana: 'しゃ', romaji: ['sha','sya'] }, { kana: 'しゅ', romaji: ['shu','syu'] }, { kana: 'しょ', romaji: ['sho','syo'] },

  { kana: 'にゃ', romaji: ['nya'] }, { kana: 'にゅ', romaji: ['nyu'] }, { kana: 'にょ', romaji: ['nyo'] },
  { kana: 'ひゃ', romaji: ['hya'] }, { kana: 'ひゅ', romaji: ['hyu'] }, { kana: 'ひょ', romaji: ['hyo'] },
  { kana: 'みゃ', romaji: ['mya'] }, { kana: 'みゅ', romaji: ['myu'] }, { kana: 'みょ', romaji: ['myo'] },

  { kana: 'じゃ', romaji: ['ja','jya','zya'] }, { kana: 'じゅ', romaji: ['ju','jyu'] }, { kana: 'じょ', romaji: ['jo','jyo'] },

  { kana: 'ぴゃ', romaji: ['pya'] }, { kana: 'ぴゅ', romaji: ['pyu'] }, { kana: 'ぴょ', romaji: ['pyo'] },

const KATAKANA = [
  { kana: 'ア', romaji: ['a'] }, { kana: 'イ', romaji: ['i'] }, { kana: 'ウ', romaji: ['u'] },

  { kana: 'ワ', romaji: ['wa'] }, { kana: 'ヲ', romaji: ['wo','o'] }, { kana: 'ン', romaji: ['n','nn'] },
  // Dakuten
  { kana: 'ガ', romaji: ['ga'] }, { kana: 'ギ', romaji: ['gi'] }, { kana: 'グ', romaji: ['gu'] },
  { kana: 'ゲ', romaji: ['ge'] }, { kana: 'ゴ', romaji: ['go'] },
  { kana: 'ザ', romaji: ['za'] }, { kana: 'ジ', romaji: ['ji','zi'] }, { kana: 'ズ', romaji: ['zu'] },

  { kana: 'ダ', romaji: ['da'] }, { kana: 'ヂ', romaji: ['di','ji'] }, { kana: 'ヅ', romaji: ['du','zu'] },
  { kana: 'デ', romaji: ['de'] }, { kana: 'ド', romaji: ['do'] },
  { kana: 'バ', romaji: ['ba'] }, { kana: 'ビ', romaji: ['bi'] }, { kana: 'ブ', romaji: ['bu'] },
  { kana: 'ベ', romaji: ['be'] }, { kana: 'ボ', romaji: ['bo'] },
  { kana: 'パ', romaji: ['pa'] }, { kana: 'ピ', romaji: ['pi'] }, { kana: 'プ', romaji: ['pu'] },
  { kana: 'ペ', romaji: ['pe'] }, { kana: 'ポ', romaji: ['po'] },
  // Combos
  { kana: 'キャ', romaji: ['kya'] }, { kana: 'キュ', romaji: ['kyu'] }, { kana: 'キョ', romaji: ['kyo'] },
  { kana: 'シャ', romaji: ['sha','sya'] }, { kana: 'シュ', romaji: ['shu','syu'] }, { kana: 'ショ', romaji: ['sho','syo'] },
  { kana: 'チャ', romaji: ['cha','tya','cya'] }, { kana: 'チュ', romaji: ['chu','tyu'] }, { kana: 'チョ', romaji: ['cho','tyo'] },
  { kana: 'ニャ', romaji: ['nya'] }, { kana: 'ニュ', romaji: ['nyu'] }, { kana: 'ニョ', romaji: ['nyo'] },
  { kana: 'ヒャ', romaji: ['hya'] }, { kana: 'ヒュ', romaji: ['hyu'] }, { kana: 'ヒョ', romaji: ['hyo'] },
  { kana: 'ミャ', romaji: ['mya'] }, { kana: 'ミュ', romaji: ['myu'] }, { kana: 'ミョ', romaji: ['myo'] },
  { kana: 'リャ', romaji: ['rya'] }, { kana: 'リュ', romaji: ['ryu'] }, { kana: 'リョ', romaji: ['ryo'] },
  { kana: 'ギャ', romaji: ['gya'] }, { kana: 'ギュ', romaji: ['gyu'] }, { kana: 'ギョ', romaji: ['gyo'] },
  { kana: 'ジャ', romaji: ['ja','jya','zya'] }, { kana: 'ジュ', romaji: ['ju','jyu'] }, { kana: 'ジョ', romaji: ['jo','jyo'] },
  { kana: 'ビャ', romaji: ['bya'] }, { kana: 'ビュ', romaji: ['byu'] }, { kana: 'ビョ', romaji: ['byo'] },
  { kana: 'ピャ', romaji: ['pya'] }, { kana: 'ピュ', romaji: ['pyu'] }, { kana: 'ピョ', romaji: ['pyo'] },
];

// <-- Game state -->
const state = {
  mode: null,
  sequence: [],
  currentIndex: 0,
  startTime: null,
  timerInterval: null,
  elapsedMs: 0,
  wrongAttempts: 0,
};

// <-- Utility functions -->
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  const centiseconds = Math.floor((ms % 1000) / 10);
  return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(centiseconds).padStart(2,'0')}`;
}

function loadRecords() {
  return JSON.parse(localStorage.getItem('kanaSpeedrunRecords') || '{}');
}

function saveRecord(mode, ms) {
  const records = loadRecords();
  if (!records[mode] || ms < records[mode]) {
    records[mode] = ms;
    localStorage.setItem('kanaSpeedrunRecords', JSON.stringify(records));
    return true;
  }
  return false;
}

function refreshRecordDisplay() {
  const records = loadRecords();
  ['hiragana', 'katakana', 'both'].forEach(m => {
    const el = document.getElementById(`rec-${m}`);
    el.textContent = records[m] ? formatTime(records[m]) : '--:--.--';
  });
}

// <-- Screen management -->
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${id}`).classList.add('active');
}

// <-- Mode selection -->
function selectMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById(`btn-${mode}`).classList.add('selected');
  const btn = document.getElementById('start-btn');
  btn.disabled = false;
  btn.textContent = 'Commencer';
}

// <-- Countdown then game start -->
function startCountdown() {
  showScreen('countdown');
  const countEl = document.getElementById('countdown-num');
  const subEl = document.getElementById('countdown-sub');
  let count = 3;

  const tick = () => {
    countEl.style.animation = 'none';
    countEl.offsetHeight;
    countEl.style.animation = 'countPop 0.8s ease forwards';

    if (count > 0) {
      countEl.textContent = count;
      subEl.textContent = count === 3 ? 'preparez-vous' : count === 2 ? 'presque...' : 'allez !';
      count--;
      setTimeout(tick, 900);
    } else {
      countEl.textContent = 'GO';
      subEl.textContent = '';
      setTimeout(launchGame, 600);
    }
  };

  tick();
}

// <-- Build sequence and start game -->
function launchGame() {
  let pool = [];
  if (state.mode === 'hiragana') pool = HIRAGANA;
  else if (state.mode === 'katakana') pool = KATAKANA;
  else pool = [...HIRAGANA, ...KATAKANA];

  state.sequence = shuffle(pool).slice(0, 20);
  state.currentIndex = 0;
  state.wrongAttempts = 0;
  state.elapsedMs = 0;

  renderSequence();
  updateProgress();

  document.getElementById('romaji-input').value = '';
  document.getElementById('input-hint').textContent = '';
  document.getElementById('mode-label-game').textContent = state.mode === 'both' ? 'mixte' : state.mode;

  showScreen('game');
  document.getElementById('romaji-input').focus();

  state.startTime = performance.now();
  state.timerInterval = setInterval(updateTimer, 30);
}

// <-- Timer loop -->
function updateTimer() {
  state.elapsedMs = performance.now() - state.startTime;
  document.getElementById('timer-display').textContent = formatTime(state.elapsedMs);
}

// <-- Render all kana tokens -->
function renderSequence() {
  const container = document.getElementById('kana-sequence');
  container.innerHTML = '';
  state.sequence.forEach((item, i) => {
    const span = document.createElement('span');
    span.className = 'kana-token';
    span.id = `kana-${i}`;
    span.textContent = item.kana;
    if (i < state.currentIndex) span.classList.add('done');
    else if (i === state.currentIndex) span.classList.add('current');
    else span.classList.add('pending');
    container.appendChild(span);
  });
  scrollCurrentIntoView();
}

function scrollCurrentIntoView() {
  const current = document.getElementById(`kana-${state.currentIndex}`);
  if (current) current.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

function updateProgress() {
  const total = state.sequence.length;
  const done = state.currentIndex;
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('progress-bar').style.width = `${(done / total) * 100}%`;
}

// <-- Input validation -->
document.addEventListener('DOMContentLoaded', () => {
  refreshRecordDisplay();

  const input = document.getElementById('romaji-input');

  input.addEventListener('input', () => {
    if (state.currentIndex >= state.sequence.length) return;

    const typed = input.value.toLowerCase().trim();
    const current = state.sequence[state.currentIndex];
    const accepted = current.romaji;

    if (accepted.includes(typed)) {
      input.className = 'romaji-input correct';

      const token = document.getElementById(`kana-${state.currentIndex}`);
      token.classList.remove('current');
      token.classList.add('done');

      state.currentIndex++;
      input.value = '';
      input.className = 'romaji-input';

      if (state.currentIndex < state.sequence.length) {
        const nextToken = document.getElementById(`kana-${state.currentIndex}`);
        nextToken.classList.remove('pending');
        nextToken.classList.add('current');
        scrollCurrentIntoView();
        document.getElementById('input-hint').textContent = '';
      } else {
        finishGame();
        return;
      }

      updateProgress();
    } else {
      const isPartialMatch = accepted.some(r => r.startsWith(typed));
      if (!isPartialMatch && typed.length > 0) {
        input.className = 'romaji-input wrong';
        state.wrongAttempts++;
        setTimeout(() => { input.className = 'romaji-input'; }, 300);
      }
    }
  });
});

// <-- Finish and show results -->
function finishGame() {
  clearInterval(state.timerInterval);
  state.elapsedMs = performance.now() - state.startTime;

  const finalMs = Math.round(state.elapsedMs);
  const isNewRecord = saveRecord(state.mode, finalMs);
  const records = loadRecords();

  const seconds = finalMs / 1000;
  const speed = (state.sequence.length / seconds).toFixed(2);

  const timeStr = formatTime(finalMs);
  const [mainPart, centPart] = timeStr.split('.');
  document.getElementById('result-time-display').innerHTML = `${mainPart}<span class="unit">.${centPart}</span>`;

  document.getElementById('stat-kana').textContent = state.sequence.length;
  document.getElementById('stat-speed').textContent = speed;

  const badgeEl = document.getElementById('new-record-badge');
  if (isNewRecord) {
    badgeEl.innerHTML = '<span class="record-badge">nouveau record</span>';
  } else {
    badgeEl.innerHTML = '';
  }

  const bestMs = records[state.mode];
  document.getElementById('best-record-line').textContent = bestMs
    ? `Meilleur : ${formatTime(bestMs)}`
    : '';

  refreshRecordDisplay();
  showScreen('results');
}

// <-- Navigation actions -->
function retryGame() {
  startCountdown();
}

function goToMenu() {
  showScreen('menu');
  refreshRecordDisplay();
}
</script>
